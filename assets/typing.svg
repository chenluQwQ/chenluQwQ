<svg xmlns="http://www.w3.org/2000/svg" width="420" height="50" viewBox="0 0 420 50" role="img" aria-label="也可以叫我柠弥，欢迎来看我的主页">
  <defs><clipPath id="t"><rect x="34.0" y="0" height="50" width="0"><animate attributeName="width" values="0;22;44;66;88;110;132;154;176;198;220;242;264;286;308;330;352;352" keyTimes="0.0;0.0344;0.0688;0.1031;0.1375;0.1719;0.2063;0.2406;0.275;0.3094;0.3438;0.3781;0.4125;0.4469;0.4813;0.5156;0.55;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath><style>
      .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw { animation: tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation: tw 4.3s ease-in-out infinite 1.2s; transform-box: fill-box; transform-origin: center; }
