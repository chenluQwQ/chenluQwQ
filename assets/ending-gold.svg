<svg xmlns="http://www.w3.org/2000/svg" width="760" height="90" viewBox="0 0 760 90" role="img" aria-label="谢谢你来看我的主页，有空常来玩">
  <defs><style>
      .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw { animation: tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation: tw 4.3s ease-in-out infinite 1.2s; transform-box: fill-box; transform-origin: center; }
      .bob { animation: bob 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
      @keyframes tw { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-5px) rotate(-5deg); } }

      .ah { font: 600 24px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #4E4B5C; letter-spacing: 4px; }
      .at { font: 400 16px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #6C6878; }
      .hl { font: 500 16px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #B08F3E; }
      .end { font: 500 17px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #4E4B5C; letter-spacing: 2px; }
      .sm { font: 400 14px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #8C889A; }</style></defs>
  <g transform="translate(272 40)"><g class="tw"><path d="M0 -5 Q1.4000000000000001 -1.4000000000000001 5 0 Q1.4000000000000001 1.4000000000000001 0 5 Q-1.4000000000000001 1.4000000000000001 -5 0 Q-1.4000000000000001 -1.4000000000000001 0 -5 Z" fill="#D8B55B" opacity="1"/></g></g><g transform="translate(488 40)"><g class="tw2"><path d="M0 -4 Q1.12 -1.12 4 0 Q1.12 1.12 0 4 Q-1.12 1.12 -4 0 Q-1.12 -1.12 0 -4 Z" fill="#EAD9A8" opacity="1"/></g></g>
  <text x="380" y="46" text-anchor="middle" class="end">谢谢你来看我的主页</text>
  <text x="380" y="72" text-anchor="middle" class="sm">有空常来玩～ (｡･ω･｡)ﾉ♡</text>
</svg>
