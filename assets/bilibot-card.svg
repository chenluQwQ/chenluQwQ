<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" role="img" aria-label="B站 AI Bot 插件">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF2"/>
      <stop offset="0.55" stop-color="#FFF6CC"/>
      <stop offset="1" stop-color="#FFE98A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD84D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="820" height="240" rx="22"/></clipPath>
    <style>
      .label { font: 600 12px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #C9A227; }
      .title { font: 700 30px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #5C4520; }
      .desc  { font: 400 15px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #8B6B3D; }
      .tag   { font: 500 12px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #8B6B3D; }
      .more  { font: 500 13px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #B8901F; }
      .sheen { animation: sweep 7s ease-in-out infinite; }
      .float { animation: float 6s ease-in-out infinite; transform-origin: 700px 118px; }
      @keyframes sweep { 0%, 55% { transform: translateX(-420px); } 100% { transform: translateX(1000px); } }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-6px) rotate(-4deg); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="820" height="240" fill="url(#bg)"/>
    <circle cx="700" cy="118" r="160" fill="url(#glow)"/>
    <rect class="sheen" x="0" y="-40" width="260" height="320" fill="url(#sheen)" transform="skewX(-20)"/>

    <!-- 柠檬片 -->
    <g class="float">
      <circle cx="700" cy="118" r="58" fill="#FFD23F"/>
      <circle cx="700" cy="118" r="51" fill="#FFF8DC"/>
      <g fill="#FFE680" stroke="#FFE680" stroke-width="3">
        <path d="M707.0 118.5 L739.9 120.8 A40 40 0 0 1 730.2 144.2 L705.3 122.6 Z" stroke-linejoin="round"/>
        <path d="M704.6 123.3 L726.2 148.2 A40 40 0 0 1 702.8 157.9 L700.5 125.0 Z" stroke-linejoin="round"/>
        <path d="M699.5 125.0 L697.2 157.9 A40 40 0 0 1 673.8 148.2 L695.4 123.3 Z" stroke-linejoin="round"/>
        <path d="M694.7 122.6 L669.8 144.2 A40 40 0 0 1 660.1 120.8 L693.0 118.5 Z" stroke-linejoin="round"/>
        <path d="M693.0 117.5 L660.1 115.2 A40 40 0 0 1 669.8 91.8 L694.7 113.4 Z" stroke-linejoin="round"/>
        <path d="M695.4 112.7 L673.8 87.8 A40 40 0 0 1 697.2 78.1 L699.5 111.0 Z" stroke-linejoin="round"/>
        <path d="M700.5 111.0 L702.8 78.1 A40 40 0 0 1 726.2 87.8 L704.6 112.7 Z" stroke-linejoin="round"/>
        <path d="M705.3 113.4 L730.2 91.8 A40 40 0 0 1 739.9 115.2 L707.0 117.5 Z" stroke-linejoin="round"/>
      </g>
      <circle cx="700" cy="118" r="4" fill="#FFF8DC"/>
      <ellipse cx="678" cy="92" rx="10" ry="5" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-35 678 92)"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="819" height="239" rx="21.5" fill="none" stroke="#F2D35B" stroke-opacity="0.6"/>

  <text x="48" y="62" class="label">ASTRBOT PLUGIN</text>
  <text x="48" y="104" class="title">B站 AI Bot 插件</text>
  <rect x="48" y="120" width="36" height="3" rx="1.5" fill="#FFD23F"/>
  <text x="48" y="152" class="desc">让 AI 角色在 B站活起来：刷视频、听声音、回评论，</text>
  <text x="48" y="176" class="desc">记得看过什么、和谁聊过什么。</text>

  <g transform="translate(48 196)">
    <rect width="62" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.7"/>
    <text x="31" y="14" text-anchor="middle" class="tag">Python</text>
    <rect x="70" width="70" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.7"/>
    <text x="105" y="14" text-anchor="middle" class="tag">AstrBot</text>
    <rect x="148" width="62" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.7"/>
    <text x="179" y="14" text-anchor="middle" class="tag">bilibili</text>
  </g>

  <text x="772" y="211" text-anchor="end" class="more">查看仓库 →</text>
</svg>
