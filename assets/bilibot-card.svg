<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" role="img" aria-label="B站 AI Bot 插件">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFEF4"/><stop offset="0.5" stop-color="#FBF8DA"/><stop offset="1" stop-color="#EEF5CF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE680" stop-opacity="0.45"/><stop offset="1" stop-color="#FFE680" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="820" height="240" rx="24"/></clipPath>
    <style>
      .label { font: 600 12px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #8DB255; }
      .title { font: 700 30px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #4F5A2C; }
      .desc  { font: 400 15px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #6E6A3E; }
      .tag   { font: 500 12px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #6B8A3A; }
      .more  { font: 500 13px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #7FA94E; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="820" height="240" fill="url(#bg)"/>
    <circle cx="720" cy="190" r="170" fill="url(#glow)"/>
    <g opacity="0.85" transform="rotate(-12 752 214)"><circle cx="752" cy="214" r="70" fill="#FFD84D"/><circle cx="752" cy="214" r="61.6" fill="#FFFBE6"/><g fill="#FFEB8A" stroke="#FFEB8A" stroke-width="2.5" stroke-linejoin="round"><path d="M760.4 214.7 L800.8 218.3 A49.0 49.0 0 0 1 789.5 245.5 L758.4 219.4 Z"/><path d="M757.4 220.4 L783.5 251.5 A49.0 49.0 0 0 1 756.3 262.8 L752.7 222.4 Z"/><path d="M751.3 222.4 L747.7 262.8 A49.0 49.0 0 0 1 720.5 251.5 L746.6 220.4 Z"/><path d="M745.6 219.4 L714.5 245.5 A49.0 49.0 0 0 1 703.2 218.3 L743.6 214.7 Z"/><path d="M743.6 213.3 L703.2 209.7 A49.0 49.0 0 0 1 714.5 182.5 L745.6 208.6 Z"/><path d="M746.6 207.6 L720.5 176.5 A49.0 49.0 0 0 1 747.7 165.2 L751.3 205.6 Z"/><path d="M752.7 205.6 L756.3 165.2 A49.0 49.0 0 0 1 783.5 176.5 L757.4 207.6 Z"/><path d="M758.4 208.6 L789.5 182.5 A49.0 49.0 0 0 1 800.8 209.7 L760.4 213.3 Z"/></g><circle cx="752" cy="214" r="4.9" fill="#FFFBE6"/><ellipse cx="725.4" cy="182.5" rx="12.6" ry="5.6" fill="#fff" fill-opacity="0.6" transform="rotate(-35 725.4 182.5)"/></g>
