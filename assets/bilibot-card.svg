  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFEF4"/>
      <stop offset="0.5" stop-color="#FBF8DA"/>
      <stop offset="1" stop-color="#EEF5CF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE680" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFE680" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4EAA8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D4EAA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="820" height="240" rx="24"/></clipPath>
    <style>
      .label { font: 600 12px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #8DB255; }
      .title { font: 700 30px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #4F5A2C; }
      .desc  { font: 400 15px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #6E6A3E; }
      .tag   { font: 500 12px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #6B8A3A; }
      .more  { font: 500 13px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #8DB255; }
      .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle { animation: tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle2 { animation: tw 4.1s ease-in-out infinite 1s; transform-box: fill-box; transform-origin: center; }
      .bob { animation: bob 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes sweep { 0%, 60% { transform: translateX(-420px); } 100% { transform: translateX(1000px); } }
      @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
      @keyframes tw { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-5px) rotate(-5deg); } }
    </style>
  </defs>
