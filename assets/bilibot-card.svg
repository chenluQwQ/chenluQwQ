  <rect x="0.5" y="0.5" width="819" height="239" rx="23.5" fill="none" stroke="#CFE3A6" stroke-opacity="0.8"/>
  <text x="48" y="64" class="label">ASTRBOT PLUGIN</text>
  <text x="48" y="104" class="title">B站 AI Bot 插件</text>
  <path d="M48 120 q 9 -5 18 0 t 18 0" fill="none" stroke="#A9CB78" stroke-width="2.4" stroke-linecap="round"/>
  <text x="48" y="150" class="desc">让 AI 角色在 B站活起来：刷视频、听声音、回评论，</text>
  <text x="48" y="174" class="desc">记得看过什么、和谁聊过什么。</text>
  <g transform="translate(48 190)">
    <rect width="62" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.75"/><text x="31" y="14" text-anchor="middle" class="tag">Python</text>
    <rect x="70" width="70" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.75"/><text x="105" y="14" text-anchor="middle" class="tag">AstrBot</text>
  </g>
