<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="B站 AI Bot 插件">
  <defs><style>
      .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw { animation: tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation: tw 4.3s ease-in-out infinite 1.2s; transform-box: fill-box; transform-origin: center; }
      .bob { animation: bob 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
      @keyframes tw { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-5px) rotate(-5deg); } }

      .label { font: 600 12px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #8DB255; }
      .title { font: 700 28px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #4F5A2C; }
      .desc  { font: 400 15px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #6E6A3E; }
      .star  { font: 600 13px 'Helvetica Neue', Arial, sans-serif; fill: #6B8A3A; }
      .more  { font: 500 14px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #7FA94E; }</style></defs>
  <rect width="760" height="250" rx="24" fill="#FFFFFF"/>
  <rect x="520" y="40" width="190" height="170" rx="28" fill="#FBF5D0"/>
  <rect x="494" y="150" width="70" height="70" rx="18" fill="#E5EFC6"/>
  <rect x="682" y="24" width="46" height="46" rx="12" fill="#F3E79F" fill-opacity="0.7"/>
  <g transform="rotate(-12 615 125)" class="bob"><circle cx="615" cy="125" r="46" fill="#FFD84D"/><circle cx="615" cy="125" r="40.5" fill="#FFFBE6"/><g fill="#FFEB8A" stroke="#FFEB8A" stroke-width="2.5" stroke-linejoin="round"><path d="M620.5 125.5 L647.1 127.8 A32.2 32.2 0 0 1 639.7 145.7 L619.2 128.5 Z"/><path d="M618.5 129.2 L635.7 149.7 A32.2 32.2 0 0 1 617.8 157.1 L615.5 130.5 Z"/><path d="M614.5 130.5 L612.2 157.1 A32.2 32.2 0 0 1 594.3 149.7 L611.5 129.2 Z"/><path d="M610.8 128.5 L590.3 145.7 A32.2 32.2 0 0 1 582.9 127.8 L609.5 125.5 Z"/><path d="M609.5 124.5 L582.9 122.2 A32.2 32.2 0 0 1 590.3 104.3 L610.8 121.5 Z"/><path d="M611.5 120.8 L594.3 100.3 A32.2 32.2 0 0 1 612.2 92.9 L614.5 119.5 Z"/><path d="M615.5 119.5 L617.8 92.9 A32.2 32.2 0 0 1 635.7 100.3 L618.5 120.8 Z"/><path d="M619.2 121.5 L639.7 104.3 A32.2 32.2 0 0 1 647.1 122.2 L620.5 124.5 Z"/></g><circle cx="615" cy="125" r="3.2" fill="#FFFBE6"/><ellipse cx="597.5" cy="104.3" rx="8.3" ry="3.7" fill="#fff" fill-opacity="0.6" transform="rotate(-35 597.5 104.3)"/></g>
  <g transform="translate(530 64)"><g class="tw"><path d="M0 -6 Q1.6800000000000002 -1.6800000000000002 6 0 Q1.6800000000000002 1.6800000000000002 0 6 Q-1.6800000000000002 1.6800000000000002 -6 0 Q-1.6800000000000002 -1.6800000000000002 0 -6 Z" fill="#F2D64B" opacity="1"/></g></g><g transform="translate(716 196)"><g class="tw2"><path d="M0 -5 Q1.4000000000000001 -1.4000000000000001 5 0 Q1.4000000000000001 1.4000000000000001 0 5 Q-1.4000000000000001 1.4000000000000001 -5 0 Q-1.4000000000000001 -1.4000000000000001 0 -5 Z" fill="#C9DE94" opacity="1"/></g></g><g transform="translate(470 60)"><g class="tw2"><path d="M0 -4 Q1.12 -1.12 4 0 Q1.12 1.12 0 4 Q-1.12 1.12 -4 0 Q-1.12 -1.12 0 -4 Z" fill="#F2D64B" opacity="1"/></g></g><g transform="translate(440 206)"><path d="M0 -3.5 Q0.9800000000000001 -0.9800000000000001 3.5 0 Q0.9800000000000001 0.9800000000000001 0 3.5 Q-0.9800000000000001 0.9800000000000001 -3.5 0 Q-0.9800000000000001 -0.9800000000000001 0 -3.5 Z" fill="#C9DE94" opacity="1"/></g>
  <text x="56" y="70" class="label">ASTRBOT PLUGIN</text>
  <text x="56" y="110" class="title">B站 AI Bot 插件</text>
  <path d="M56 126 q 9 -5 18 0 t 18 0" fill="none" stroke="#A9CB78" stroke-width="2.4" stroke-linecap="round"/>
  <text x="56" y="158" class="desc">让 AI 角色在 B站活起来：刷视频、听声音、回评论，</text>
