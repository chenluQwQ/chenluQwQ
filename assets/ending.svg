<svg xmlns="http://www.w3.org/2000/svg" width="760" height="120" viewBox="0 0 760 120" role="img" aria-label="谢谢你来看我的主页，有空常来玩">
  <defs><style>
      .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw { animation: tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation: tw 4.3s ease-in-out infinite 1.2s; transform-box: fill-box; transform-origin: center; }
      .bob { animation: bob 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
      @keyframes tw { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-5px) rotate(-5deg); } }

      .end { font: 500 18px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #6E6A3E; letter-spacing: 1px; }
      .sm  { font: 400 14px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif; fill: #9A9466; }</style></defs>
  <rect x="250" y="30" width="260" height="60" rx="30" fill="#FBF5D0"/>
  <rect x="226" y="62" width="34" height="34" rx="10" fill="#E5EFC6"/>
  <rect x="500" y="22" width="26" height="26" rx="8" fill="#F3E79F" fill-opacity="0.7"/>
  <g transform="translate(214 34)"><g class="tw"><path d="M0 -6 Q1.6800000000000002 -1.6800000000000002 6 0 Q1.6800000000000002 1.6800000000000002 0 6 Q-1.6800000000000002 1.6800000000000002 -6 0 Q-1.6800000000000002 -1.6800000000000002 0 -6 Z" fill="#F2D64B" opacity="1"/></g></g><g transform="translate(546 80)"><g class="tw2"><path d="M0 -5 Q1.4000000000000001 -1.4000000000000001 5 0 Q1.4000000000000001 1.4000000000000001 0 5 Q-1.4000000000000001 1.4000000000000001 -5 0 Q-1.4000000000000001 -1.4000000000000001 0 -5 Z" fill="#C9DE94" opacity="1"/></g></g><g transform="translate(560 40)"><path d="M0 -3.5 Q0.9800000000000001 -0.9800000000000001 3.5 0 Q0.9800000000000001 0.9800000000000001 0 3.5 Q-0.9800000000000001 0.9800000000000001 -3.5 0 Q-0.9800000000000001 -0.9800000000000001 0 -3.5 Z" fill="#F2D64B" opacity="1"/></g><g transform="translate(196 76)"><g class="tw2"><path d="M0 -3.5 Q0.9800000000000001 -0.9800000000000001 3.5 0 Q0.9800000000000001 0.9800000000000001 0 3.5 Q-0.9800000000000001 0.9800000000000001 -3.5 0 Q-0.9800000000000001 -0.9800000000000001 0 -3.5 Z" fill="#C9DE94" opacity="1"/></g></g>
  <text x="380" y="58" text-anchor="middle" class="end">谢谢你来看我的主页</text>
  <text x="380" y="80" text-anchor="middle" class="sm">有空常来玩～ (｡･ω･｡)ﾉ♡</text>
